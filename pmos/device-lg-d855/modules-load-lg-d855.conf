# Le GPU Adreno ne déclenche pas le chargement de msm (pas de
# MODULE_DEVICE_TABLE côté adreno, et le MDSS qui le fait est désactivé).
msm
# Changement de fréquence des Krait : qcom-cpufreq-nvmem se déclare pour le
# compatible de la racine du DT (qcom,msm8974), pour lequel udev n'émet aucun
# événement : sans ce chargement explicite, les cœurs restent à la fréquence
# fixée par krait-cc au démarrage (384 MHz pour CPU1-3). Il crée ensuite le
# périphérique cpufreq-dt, chargé, lui, par udev.
qcom_cpufreq_nvmem
