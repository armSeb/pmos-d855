# Le RTC du PM8941 repart en 1970 (pas de pile de sauvegarde exploitable) :
# tant que l'heure n'est pas synchronisée, la validation DNSSEC échoue
# (signatures « pas encore valides ») et plus aucun nom ne se résout, NTP
# compris. On désactive DNSSEC pour sortir de ce cercle vicieux.
[Resolve]
DNSSEC=no
