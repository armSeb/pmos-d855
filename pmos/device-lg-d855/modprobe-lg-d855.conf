# GPU Adreno 330 sans pilote d'affichage msm (l'écran reste sur
# simple-framebuffer) : périphérique de rendu seul (patch noyau 0005).
# Pas d'IOMMU GPU décrite pour la MSM8974 : zone mémoire réservée (CMA),
# sans protection mémoire entre GPU et système.
options msm headless_gpu=1 allow_vram_carveout=1 vram=128m
