# msm : affichage natif (MDP5 en « split display », patch noyau 0006) et GPU
# Adreno 330. Pas d'IOMMU décrite pour le MDP ni le GPU de la MSM8974 : zone
# mémoire réservée (CMA), sans protection mémoire entre GPU et système.
# (headless_gpu=1, patch 0005 : GPU en rendu seul si l'affichage msm est
# désactivé dans le DTS.)
options msm allow_vram_carveout=1 vram=128m
# Panneau : tant que la séquence d'init complète laisse l'écran noir, on garde
# l'état laissé par le bootloader au premier allumage (affichage natif OK).
# Attention : un rallumage après mise en veille de l'écran refait l'init
# complète (init_steps), donc écran noir. Pour tester une init au démarrage,
# ajouter « panel_lge_g3_lgd_sic.keep_init=0 » à la ligne de commande : elle
# passe après ce fichier et l'emporte.
options panel-lge-g3-lgd-sic keep_init=1
